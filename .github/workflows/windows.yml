name: Windows desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
      - name: Test packaged Windows player
        shell: pwsh
        run: |
          $env:XMUSIC_EXECUTABLE = Join-Path $PWD 'release/win-unpacked/Xmusic.exe'
          npm run test:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Xmusic-Windows-x64
          path: |
            desktop/release/*-setup.exe
            desktop/release/*-portable.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-screenshots
          path: desktop/.test-data/smoke-*/*.png
          if-no-files-found: ignore
