<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xmusic 桌面歌词</title>
  <link rel="stylesheet" href="lyrics.css">
</head>
<body>
    <header class="toolbar" id="floating-toolbar" title="拖动标题移动窗口，拖动窗口边缘调整大小">
      <span id="song-title">Xmusic · 桌面歌词</span>
      <nav aria-label="悬浮歌词控制">
        <button type="button" data-command="previous" aria-label="上一首" title="上一首"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m19 20-9-8 9-8v16Z"/><path d="M5 4v16"/></svg></button>
        <button type="button" data-command="toggle" id="toggle" data-playing="false" aria-label="播放" title="播放"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m8 4 12 8-12 8V4Z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 4v16M16 4v16"/></svg></button>
        <button type="button" data-command="next" aria-label="下一首" title="下一首"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m5 4 9 8-9 8V4Z"/><path d="M19 4v16"/></svg></button>
        <button type="button" data-command="show-main" aria-label="返回播放器" title="返回播放器"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M8 21h8m-4-4v4M8 7h8"/></svg></button>
        <button type="button" data-command="lock" aria-label="锁定并穿透鼠标" title="锁定并穿透鼠标；可从主窗口解锁"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4m-4 5v2"/></svg></button>
        <button type="button" data-command="close" aria-label="关闭桌面歌词" title="关闭桌面歌词"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </nav>
    </header>
  <main class="lyrics-window" id="lyrics-panel">
    <div class="lyrics-background" aria-hidden="true"></div>
    <div class="lyric-lines" id="lyric-lines">
      <p id="current-line" tabindex="0" title="右键复制这句歌词">播放一首喜欢的歌</p>
      <p id="next-line" tabindex="0" title="右键复制这句歌词"></p>
    </div>
    <span id="copy-notice" class="copy-notice" role="status" hidden></span>
  </main>
  <span class="lyric-measure" id="measure-current" aria-hidden="true"></span>
  <span class="lyric-measure" id="measure-next" aria-hidden="true"></span>
  <script src="lyrics.js"></script>
</body>
</html>
