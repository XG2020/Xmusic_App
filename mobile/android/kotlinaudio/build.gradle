plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace = "com.doublesymmetry.kotlinaudio"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        consumerProguardFiles 'proguard-rules.pro'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++11'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.21.0+'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'io.coil-kt:coil:2.2.0'
    implementation 'androidx.media:media:1.6.0'
    api 'com.google.android.exoplayer:exoplayer:2.19.0'
    // The FFmpeg Java renderer is vendored from the matching ExoPlayer source;
    // its native ffmpegJNI library is built by the CMake target above.
    api 'com.google.android.exoplayer:extension-mediasession:2.19.0'
    api 'com.jakewharton.timber:timber:5.0.1'
    implementation 'androidx.annotation:annotation:1.3.0'
    compileOnly 'org.checkerframework:checker-qual:3.13.0'
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:1.8.20'
}
